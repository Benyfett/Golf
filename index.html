<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101513">
<title>골프 앱</title>
<link rel="icon" href="swing-frame/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Hub page for the Golf apps. Deliberately has no service worker, so it never intercepts the apps in sub-folders. */
:root {
  --bg: #e9ede9; --panel: #f7f9f7; --ink: #17201b; --muted: #5a6860; --rule: #cfd8d2; --accent: #a8610a;
  --font-ui: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101513; --panel: #171e1b; --ink: #e6ece8; --muted: #8e9d95; --rule: #27312c; --accent: #f0ad3a; color-scheme: dark; }
}
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-ui);
  padding: calc(28px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-num); font-size: 34px; letter-spacing: .02em; margin: 0; line-height: 1; }
h1 b { color: var(--accent); }
p.sub { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
a.app {
  display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: var(--panel);
  border: 1px solid var(--rule); color: inherit; text-decoration: none;
}
a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a.app img { width: 52px; height: 52px; border-radius: 12px; flex: none; }
a.app div { min-width: 0; }
a.app strong { display: block; font-weight: 600; }
a.app span { display: block; color: var(--muted); font-size: 13px; }
.note { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--rule); padding-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>골프 <b>앱</b></h1>
  <p class="sub">개인용 골프 도구 모음</p>
  <a class="app" href="swing-frame/">
    <img src="swing-frame/icon-192.png" alt="">
    <div><strong>스윙 프레임</strong><span>스윙 영상을 프레임 단위로 넘기며 선·원·각도로 분석</span></div>
  </a>
  <p class="note">각 앱을 열고 크롬 메뉴 → 홈 화면에 추가하면 앱처럼 전체 화면으로 실행됩니다. 영상과 기록은 폰 안에만 저장됩니다.</p>
</main>
</body>
</html>
